; ComfyUI-Manager: copiar para /opt/comfy/ComfyUI/user/__manager/config.ini
; Listener é a LAN (não-loopback): instalação por Git URL / pip fica negada pela UI
; independentemente dos flags abaixo. Para isso, usar cm-cli via SSH.
[default]
security_level = normal
network_mode = public
allow_git_url_install = false
allow_pip_install = false
allow_flagged_nodepack_install = false
file_logging = True
use_uv = True
